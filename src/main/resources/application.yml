spring:
  application:
    name: gateway
  security:
    oauth2:
      resourceserver:
        jwt:
          issuer-uri: ${keycloak.server-url}/realms/${keycloak.realm}
  profiles:
    active: ${PROFILE_ACTIVE:dev}

keycloak:
  enabled: ${ENABLE_SECURITY:true}
  server-url: ${KC_SERVER_URL:}
  realm: ${KC_REALM:}
  client-id: ${KC_CLIENT_ID:}
  client-secret: ${KC_CLIENT_SECRET:}

# API docs - Swagger
springdoc:
  swagger-ui:
    path: /docs
    urls[0]:
      name: Project Service
      url: /aggregate/project/v3/api-docs
    urls[1]:
      name: Chat Service
      url: /aggregate/chat/v3/api-docs
    urls[2]:
      name: File Service
      url: /aggregate/file/v3/api-docs
    urls[3]:
      name: Post Service
      url: /aggregate/post/v3/api-docs
    urls[4]:
      name: User Service
      url: /aggregate/user/v3/api-docs
  api-docs:
    path: /api-docs

app:
  chat-service-url: ${CHAT_SERVICE_URL}
  file-service-url: ${FILE_SERVICE_URL}
  post-service-url: ${POST_SERVICE_URL}
  project-service-url: ${PROJECT_SERVICE_URL}
  user-service-url: ${USER_SERVICE_URL}
